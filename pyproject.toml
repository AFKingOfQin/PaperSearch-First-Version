# AI-generated configuration (Codex): Phase 0 package and CLI.
[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "papersearch"
version = "0.0.1"
description = "Local paper screening pipeline"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.18.4",
    "SQLAlchemy==2.0.49",
    "mysql-connector-python==9.6.0",
    "kafka-python==2.3.2",
    "psutil==7.2.2",
    "python-dotenv==1.2.2",
]

[project.scripts]
papersearch = "papersearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
